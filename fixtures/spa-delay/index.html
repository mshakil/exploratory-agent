<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPA Delay Fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      .loading { color: #666; }
      nav a { margin-right: 1rem; }
      .panel { display: none; margin-top: 1.5rem; }
      .panel.active { display: block; }
      button { margin: 0.25rem 0.5rem 0.25rem 0; }
    </style>
  </head>
  <body>
    <p class="loading" id="boot">Hydrating…</p>
    <div id="app" hidden>
      <h1>SPA Delay App</h1>
      <nav>
        <a href="#/home" data-route="home">Home</a>
        <a href="#/users" data-route="users">Users</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <section class="panel" id="panel-home">
        <p>Home loaded after delayed hydrate.</p>
        <button type="button" id="btn-refresh">Refresh list</button>
      </section>
      <section class="panel" id="panel-users">
        <p>Users</p>
        <button type="button" id="btn-add-user">Add user</button>
        <ul id="user-list"><li>Ada</li></ul>
      </section>
      <section class="panel" id="panel-settings">
        <label>Theme <select id="theme"><option>Light</option><option>Dark</option></select></label>
        <button type="button" id="btn-save">Save settings</button>
      </section>
    </div>
    <script>
      // Late hydrate + client-side hash router — mimics SPA race conditions
      setTimeout(function () {
        document.getElementById("boot").hidden = true;
        document.getElementById("app").hidden = false;

        function show(route) {
          document.querySelectorAll(".panel").forEach(function (p) {
            p.classList.toggle("active", p.id === "panel-" + route);
          });
        }

        function routeFromHash() {
          var raw = (location.hash || "#/home").replace(/^#\/?/, "");
          var route = raw.split("/")[0] || "home";
          if (!document.getElementById("panel-" + route)) route = "home";
          show(route);
        }

        window.addEventListener("hashchange", routeFromHash);
        document.querySelectorAll("[data-route]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            location.hash = "#/" + a.getAttribute("data-route");
          });
        });

        document.getElementById("btn-add-user").addEventListener("click", function () {
          var li = document.createElement("li");
          li.textContent = "User " + (document.querySelectorAll("#user-list li").length + 1);
          document.getElementById("user-list").appendChild(li);
        });

        document.getElementById("btn-refresh").addEventListener("click", function () {
          document.getElementById("btn-refresh").textContent = "Refreshed";
        });

        document.getElementById("btn-save").addEventListener("click", function () {
          document.getElementById("btn-save").textContent = "Saved";
        });

        // Extra DOM churn after hydrate
        var churn = 0;
        var timer = setInterval(function () {
          churn += 1;
          document.body.dataset.churn = String(churn);
          if (churn > 8) clearInterval(timer);
        }, 40);

        routeFromHash();
      }, 1200);
    </script>
  </body>
</html>
